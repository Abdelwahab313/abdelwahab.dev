<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)">
  <rect width="1200" height="600" fill="var(--surface, #161a20)"/>

  <!-- the first booking, 10:00 to 11:00, committed -->
  <rect x="240" y="110" width="360" height="120" rx="18" fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="4"/>
  <text x="420" y="180" font-size="28" fill="var(--ink, #edeae3)" text-anchor="middle">confirmed</text>

  <!-- the second booking, 10:30 to 11:30, overlaps and is refused -->
  <rect x="420" y="270" width="360" height="120" rx="18" fill="none" stroke="var(--muted, #949aa2)" stroke-width="4" stroke-dasharray="12 12"/>
  <text x="600" y="340" font-size="28" fill="var(--muted, #949aa2)" text-anchor="middle">rejected</text>

  <!-- one mentor's hours -->
  <g stroke="var(--border, #262b33)" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="450" x2="1080" y2="450"/>
    <line x1="240" y1="436" x2="240" y2="464"/>
    <line x1="600" y1="436" x2="600" y2="464"/>
    <line x1="960" y1="436" x2="960" y2="464"/>
  </g>
  <g font-size="26" fill="var(--muted, #949aa2)" text-anchor="middle">
    <text x="240" y="508">10:00</text>
    <text x="600" y="508">11:00</text>
    <text x="960" y="508">12:00</text>
  </g>
</svg>
