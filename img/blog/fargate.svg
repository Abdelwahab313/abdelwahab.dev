<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)">
  <rect width="1200" height="600" fill="var(--surface, #161a20)"/>

  <text x="90" y="110" font-size="30" fill="var(--muted, #949aa2)">scale-in: desired 4 → 2</text>

  <!-- stop arrows from the scaler -->
  <g stroke="var(--muted, #949aa2)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M200 160 V214"/>
    <path d="M190 206 L200 217 L210 206"/>
    <path d="M466 160 V214"/>
    <path d="M456 206 L466 217 L476 206"/>
    <path d="M998 160 V214"/>
    <path d="M988 206 L998 217 L1008 206"/>
  </g>

  <!-- the one arrow that is refused -->
  <path d="M732 160 V198" stroke="var(--accent, #57c7ba)" stroke-width="3" fill="none"/>
  <path d="M672 210 H792" stroke="var(--accent, #57c7ba)" stroke-width="5" stroke-linecap="round"/>

  <!-- idle tasks, chosen for stopping -->
  <g fill="none" stroke="var(--muted, #949aa2)" stroke-width="3" stroke-dasharray="10 10">
    <rect x="90" y="236" width="220" height="190" rx="18"/>
    <rect x="356" y="236" width="220" height="190" rx="18"/>
    <rect x="888" y="236" width="220" height="190" rx="18"/>
  </g>
  <g font-size="28" fill="var(--muted, #949aa2)" text-anchor="middle">
    <text x="200" y="342">idle</text>
    <text x="466" y="342">idle</text>
    <text x="998" y="342">idle</text>
  </g>
  <g font-size="26" fill="var(--muted, #949aa2)" text-anchor="middle">
    <text x="200" y="482">stopped</text>
    <text x="466" y="482">stopped</text>
    <text x="998" y="482">stopped</text>
  </g>

  <!-- the busy, protected task -->
  <rect x="622" y="236" width="220" height="190" rx="18" fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="4"/>
  <text x="732" y="314" font-size="28" fill="var(--ink, #edeae3)" text-anchor="middle">2 h job</text>
  <rect x="662" y="346" width="140" height="14" rx="7" fill="var(--border, #262b33)"/>
  <rect x="662" y="346" width="119" height="14" rx="7" fill="var(--accent, #57c7ba)"/>
  <text x="732" y="482" font-size="26" fill="var(--accent, #57c7ba)" text-anchor="middle">protected</text>
</svg>
