<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #edeae3)"/>
    </marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #57c7ba)"/>
    </marker>
  </defs>

  <!-- left: check, then act -->
  <text x="40" y="34" fill="var(--ink, #edeae3)">check, then act</text>
  <g fill="var(--ink, #edeae3)" text-anchor="middle">
    <text x="110" y="74">Job A</text>
    <text x="300" y="74">MySQL</text>
    <text x="490" y="74">Job B</text>
  </g>
  <g stroke="var(--border, #262b33)" stroke-width="1.5">
    <line x1="110" y1="86" x2="110" y2="290"/>
    <line x1="300" y1="86" x2="300" y2="290"/>
    <line x1="490" y1="86" x2="490" y2="290"/>
  </g>

  <line x1="110" y1="120" x2="292" y2="120" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="205" y="110" fill="var(--ink, #edeae3)" text-anchor="middle">SELECT balance: 10</text>
  <line x1="490" y1="165" x2="308" y2="165" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="395" y="155" fill="var(--ink, #edeae3)" text-anchor="middle">SELECT balance: 10</text>
  <line x1="110" y1="215" x2="292" y2="215" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="205" y="205" fill="var(--ink, #edeae3)" text-anchor="middle">UPDATE balance = 2</text>
  <line x1="490" y1="260" x2="308" y2="260" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="395" y="250" fill="var(--ink, #edeae3)" text-anchor="middle">UPDATE balance = 2</text>

  <!-- the window -->
  <g stroke="var(--muted, #949aa2)" stroke-width="1.5">
    <line x1="78" y1="120" x2="78" y2="215"/>
    <line x1="72" y1="120" x2="84" y2="120"/>
    <line x1="72" y1="215" x2="84" y2="215"/>
  </g>
  <text x="66" y="172" fill="var(--muted, #949aa2)" text-anchor="end">a few ms</text>

  <text x="300" y="322" fill="var(--muted, #949aa2)" text-anchor="middle">balance 2: both passed, one charge lost</text>

  <!-- right: the check inside the write -->
  <text x="580" y="34" fill="var(--ink, #edeae3)">the check inside the write</text>
  <g fill="var(--ink, #edeae3)" text-anchor="middle">
    <text x="620" y="74">Job A</text>
    <text x="810" y="74">MySQL</text>
    <text x="1000" y="74">Job B</text>
  </g>
  <g stroke="var(--border, #262b33)" stroke-width="1.5">
    <line x1="620" y1="86" x2="620" y2="290"/>
    <line x1="810" y1="86" x2="810" y2="290"/>
    <line x1="1000" y1="86" x2="1000" y2="290"/>
  </g>

  <line x1="620" y1="120" x2="802" y2="120" stroke="var(--accent, #57c7ba)" stroke-width="1.5" marker-end="url(#acc)"/>
  <text x="715" y="110" fill="var(--ink, #edeae3)" text-anchor="middle">UPDATE balance - 8</text>
  <text x="715" y="139" fill="var(--muted, #949aa2)" text-anchor="middle">WHERE balance &gt;= 8</text>
  <line x1="810" y1="165" x2="628" y2="165" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="715" y="183" fill="var(--muted, #949aa2)" text-anchor="middle">1 row: charged</text>

  <line x1="1000" y1="215" x2="818" y2="215" stroke="var(--accent, #57c7ba)" stroke-width="1.5" marker-end="url(#acc)"/>
  <text x="905" y="205" fill="var(--ink, #edeae3)" text-anchor="middle">UPDATE balance - 8</text>
  <text x="905" y="234" fill="var(--muted, #949aa2)" text-anchor="middle">WHERE balance &gt;= 8</text>
  <line x1="810" y1="260" x2="992" y2="260" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="905" y="278" fill="var(--muted, #949aa2)" text-anchor="middle">0 rows: no credit</text>

  <text x="810" y="322" fill="var(--muted, #949aa2)" text-anchor="middle">balance 2: one charge, no gap to race in</text>
</svg>
