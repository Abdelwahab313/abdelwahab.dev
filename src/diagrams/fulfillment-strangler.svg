<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #edeae3)"/>
    </marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #57c7ba)"/>
    </marker>
  </defs>

  <!-- monolith -->
  <rect x="40" y="60" width="270" height="320" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="175" y="92" fill="var(--ink, #edeae3)" text-anchor="middle">PHP/Laravel monolith</text>

  <rect x="64" y="120" width="222" height="100" rx="8" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5"/>
  <text x="175" y="162" fill="var(--muted, #949aa2)" text-anchor="middle">everything else</text>
  <text x="175" y="186" fill="var(--muted, #949aa2)" text-anchor="middle">ships as one deploy</text>

  <rect x="64" y="244" width="222" height="100" rx="8" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="175" y="286" fill="var(--muted, #949aa2)" text-anchor="middle">fulfillment</text>
  <text x="175" y="310" fill="var(--muted, #949aa2)" text-anchor="middle">moving out</text>

  <!-- queue -->
  <rect x="420" y="180" width="220" height="80" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="530" y="212" fill="var(--ink, #edeae3)" text-anchor="middle">SQS FIFO queue</text>
  <text x="530" y="238" fill="var(--muted, #949aa2)" text-anchor="middle">order state changes</text>

  <!-- monolith -> queue -->
  <line x1="310" y1="220" x2="412" y2="220" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="361" y="209" fill="var(--muted, #949aa2)" text-anchor="middle">SendMessage</text>

  <!-- new consumer: fulfillment service -->
  <rect x="760" y="60" width="280" height="110" rx="10" fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="1.5"/>
  <text x="900" y="92" fill="var(--ink, #edeae3)" text-anchor="middle">fulfillment service</text>
  <text x="900" y="118" fill="var(--muted, #949aa2)" text-anchor="middle">Node.js/Express</text>
  <text x="900" y="144" fill="var(--muted, #949aa2)" text-anchor="middle">behind a REST contract</text>

  <path d="M700 220 V115 H752" fill="none" stroke="var(--accent, #57c7ba)" stroke-width="1.5" marker-end="url(#acc)"/>
  <text x="688" y="160" fill="var(--accent, #57c7ba)" text-anchor="end">new consumer</text>

  <!-- existing consumer: real-time order service -->
  <rect x="760" y="270" width="280" height="110" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="900" y="302" fill="var(--ink, #edeae3)" text-anchor="middle">real-time order service</text>
  <text x="900" y="328" fill="var(--muted, #949aa2)" text-anchor="middle">Node.js/Socket.IO</text>
  <text x="900" y="354" fill="var(--muted, #949aa2)" text-anchor="middle">already listening</text>

  <path d="M640 220 H700 V325 H752" fill="none" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="688" y="300" fill="var(--muted, #949aa2)" text-anchor="end">existing consumer</text>

  <text x="40" y="440" fill="var(--muted, #949aa2)">the seam already existed: a second consumer costs the monolith nothing new</text>
</svg>
