<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #edeae3)"/>
    </marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #57c7ba)"/>
    </marker>
  </defs>

  <!-- monolith -->
  <rect x="40" y="60" width="270" height="320" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="175" y="92" fill="var(--ink, #edeae3)" text-anchor="middle">monolith</text>
  <text x="175" y="114" fill="var(--muted, #949aa2)" text-anchor="middle">system of record for orders</text>

  <rect x="64" y="136" width="222" height="92" rx="8" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5"/>
  <text x="175" y="174" fill="var(--muted, #949aa2)" text-anchor="middle">everything else</text>
  <text x="175" y="198" fill="var(--muted, #949aa2)" text-anchor="middle">ships as one deploy</text>

  <rect x="64" y="252" width="222" height="92" rx="8" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="175" y="290" fill="var(--muted, #949aa2)" text-anchor="middle">fulfillment</text>
  <text x="175" y="314" fill="var(--muted, #949aa2)" text-anchor="middle">moving out</text>

  <!-- queue -->
  <rect x="420" y="140" width="220" height="80" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="530" y="172" fill="var(--ink, #edeae3)" text-anchor="middle">SQS FIFO queue</text>
  <text x="530" y="198" fill="var(--muted, #949aa2)" text-anchor="middle">order state changes</text>

  <!-- monolith -> queue -->
  <line x1="310" y1="180" x2="412" y2="180" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="361" y="169" fill="var(--muted, #949aa2)" text-anchor="middle">SendMessage</text>

  <!-- order service, the existing consumer -->
  <rect x="760" y="60" width="280" height="320" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="900" y="92" fill="var(--ink, #edeae3)" text-anchor="middle">order service</text>
  <text x="900" y="114" fill="var(--muted, #949aa2)" text-anchor="middle">Node.js/Express, Socket.IO</text>

  <rect x="784" y="136" width="232" height="92" rx="8" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5"/>
  <text x="900" y="174" fill="var(--muted, #949aa2)" text-anchor="middle">live order status</text>
  <text x="900" y="198" fill="var(--muted, #949aa2)" text-anchor="middle">consumes the queue</text>

  <rect x="784" y="252" width="232" height="92" rx="8" fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="1.5"/>
  <text x="900" y="290" fill="var(--ink, #edeae3)" text-anchor="middle">fulfillment</text>
  <text x="900" y="314" fill="var(--muted, #949aa2)" text-anchor="middle">moves in here</text>

  <!-- queue -> order service -->
  <line x1="640" y1="180" x2="752" y2="180" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="696" y="169" fill="var(--muted, #949aa2)" text-anchor="middle">existing consumer</text>

  <!-- monolith -> order service, same-day orders over REST -->
  <path d="M310 298 H752" fill="none" stroke="var(--accent, #57c7ba)" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#acc)"/>
  <text x="530" y="287" fill="var(--accent, #57c7ba)" text-anchor="middle">same-day orders over REST, on confirmation</text>

  <text x="40" y="440" fill="var(--muted, #949aa2)">the seam already existed, and so did the consumer: the monolith's event code did not change</text>
</svg>
