<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #edeae3)"/>
    </marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #57c7ba)"/>
    </marker>
  </defs>

  <!-- producer -->
  <rect x="30" y="170" width="190" height="80" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="125" y="204" fill="var(--ink, #edeae3)" text-anchor="middle">producer</text>
  <text x="125" y="228" fill="var(--muted, #949aa2)" text-anchor="middle">loop or Readable</text>

  <!-- write() arrow -->
  <line x1="220" y1="210" x2="322" y2="210" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="271" y="198" fill="var(--ink, #edeae3)" text-anchor="middle">write()</text>

  <!-- writable with its buffer -->
  <rect x="330" y="130" width="340" height="160" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="350" y="160" fill="var(--ink, #edeae3)">Writable</text>
  <text x="350" y="184" fill="var(--muted, #949aa2)">internal buffer</text>
  <rect x="350" y="204" width="300" height="30" rx="4" fill="none" stroke="var(--border, #262b33)" stroke-width="1.5"/>
  <rect x="351" y="205" width="232" height="28" rx="3" fill="var(--muted, #949aa2)" opacity="0.35"/>
  <line x1="560" y1="196" x2="560" y2="244" stroke="var(--ink, #edeae3)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="560" y="266" fill="var(--muted, #949aa2)" text-anchor="middle">highWaterMark</text>

  <!-- sink -->
  <line x1="670" y1="210" x2="772" y2="210" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="721" y="198" fill="var(--muted, #949aa2)" text-anchor="middle">slow</text>
  <rect x="780" y="170" width="150" height="80" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="855" y="204" fill="var(--ink, #edeae3)" text-anchor="middle">sink</text>
  <text x="855" y="228" fill="var(--muted, #949aa2)" text-anchor="middle">disk, socket</text>

  <!-- false: the signal back -->
  <path d="M500 130 C500 60 125 60 125 162" fill="none" stroke="var(--accent, #57c7ba)" stroke-width="1.5" marker-end="url(#acc)"/>
  <text x="312" y="62" fill="var(--accent, #57c7ba)" text-anchor="middle">false: buffer at or past the mark, stop</text>

  <!-- drain: resume -->
  <path d="M500 290 C500 370 125 370 125 258" fill="none" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="312" y="384" fill="var(--ink, #edeae3)" text-anchor="middle">'drain': buffer emptied, resume</text>
</svg>
