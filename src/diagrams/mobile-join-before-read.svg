<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <!-- row 1: read, then join -->
  <text x="24" y="92" fill="var(--ink, #edeae3)">read, then join</text>
  <text x="24" y="112" fill="var(--muted, #949aa2)">a change is lost</text>

  <line x1="230" y1="98" x2="1020" y2="98" stroke="var(--border, #262b33)" stroke-width="1.5"/>

  <rect x="260" y="80" width="190" height="36" rx="8" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="355" y="103" fill="var(--ink, #edeae3)" text-anchor="middle">read snapshot v3</text>

  <rect x="530" y="80" width="190" height="36" rx="8" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="625" y="103" fill="var(--muted, #949aa2)" text-anchor="middle">v4 published</text>
  <text x="625" y="142" fill="var(--muted, #949aa2)" text-anchor="middle">not in the room yet: missed</text>

  <rect x="800" y="80" width="190" height="36" rx="8" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="895" y="103" fill="var(--ink, #edeae3)" text-anchor="middle">join room</text>
  <text x="990" y="142" fill="var(--muted, #949aa2)" text-anchor="end">screen stays at v3</text>

  <!-- row 2: join, then read -->
  <text x="24" y="242" fill="var(--ink, #edeae3)">join, then read</text>
  <text x="24" y="262" fill="var(--muted, #949aa2)">nothing is lost</text>

  <line x1="230" y1="248" x2="1020" y2="248" stroke="var(--border, #262b33)" stroke-width="1.5"/>

  <rect x="260" y="230" width="190" height="36" rx="8" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="355" y="253" fill="var(--ink, #edeae3)" text-anchor="middle">join room</text>

  <rect x="530" y="230" width="190" height="36" rx="8" fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="1.5"/>
  <text x="625" y="253" fill="var(--ink, #edeae3)" text-anchor="middle">v4 published</text>
  <text x="625" y="292" fill="var(--accent, #57c7ba)" text-anchor="middle">in the room: arrives live</text>

  <rect x="800" y="230" width="190" height="36" rx="8" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="895" y="253" fill="var(--ink, #edeae3)" text-anchor="middle">read snapshot</text>
  <text x="990" y="292" fill="var(--muted, #949aa2)" text-anchor="end">v3 or v4</text>

  <text x="24" y="340" fill="var(--muted, #949aa2)">the snapshot may be older than the live event; the version check keeps v4</text>
</svg>
