<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <defs>
    <marker id="mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted, #949aa2)"/>
    </marker>
  </defs>

  <!-- the call stack, top to bottom, one thread -->
  <g fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5">
    <rect x="260" y="40" width="440" height="30" rx="8"/>
    <rect x="280" y="76" width="440" height="30" rx="8"/>
    <rect x="300" y="112" width="440" height="30" rx="8"/>
    <rect x="320" y="148" width="440" height="30" rx="8"/>
    <rect x="340" y="184" width="440" height="30" rx="8"/>
    <rect x="360" y="220" width="440" height="30" rx="8"/>
  </g>
  <g fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="1.5">
    <rect x="380" y="256" width="440" height="30" rx="8"/>
    <rect x="400" y="292" width="440" height="30" rx="8"/>
    <rect x="420" y="328" width="440" height="30" rx="8"/>
    <rect x="440" y="364" width="440" height="30" rx="8"/>
    <rect x="460" y="400" width="440" height="30" rx="8"/>
  </g>

  <g fill="var(--ink, #edeae3)">
    <text x="272" y="60">aeProcessEvents</text>
    <text x="292" y="96">processCommand</text>
    <text x="312" y="132">call</text>
    <text x="332" y="168">evalCommand</text>
    <text x="352" y="204">evalGenericCommand</text>
    <text x="372" y="240">luaCallFunction</text>
    <text x="392" y="276">lua_pcall</text>
    <text x="412" y="312">redis.call('GET', ...)</text>
    <text x="432" y="348">luaRedisGenericCommand</text>
    <text x="452" y="384">scriptCall</text>
    <text x="472" y="420">GET, then DECRBY</text>
  </g>
  <g fill="var(--muted, #949aa2)" text-anchor="end">
    <text x="688" y="60">src/ae.c, the event loop</text>
    <text x="708" y="96">src/server.c</text>
    <text x="728" y="132">src/server.c</text>
    <text x="748" y="168">src/eval.c</text>
    <text x="768" y="204">src/eval.c</text>
    <text x="788" y="240">src/script_lua.c</text>
    <text x="808" y="276">the script body</text>
    <text x="828" y="312">Lua</text>
    <text x="848" y="348">src/script_lua.c</text>
    <text x="868" y="384">src/script.c</text>
    <text x="888" y="420">inline, same thread</text>
  </g>

  <!-- everyone else waits at the top -->
  <rect x="30" y="68" width="190" height="60" rx="8" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="125" y="92" fill="var(--muted, #949aa2)" text-anchor="middle">other clients</text>
  <text x="125" y="114" fill="var(--muted, #949aa2)" text-anchor="middle">wait in the queue</text>
  <path d="M220 98 H252 V62" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#mut)"/>

  <!-- the bracket: no yield point -->
  <g stroke="var(--accent, #57c7ba)" stroke-width="1.5" fill="none">
    <path d="M924 256 H932 V430 H924"/>
  </g>
  <text x="944" y="338" fill="var(--ink, #edeae3)">no yield point</text>
  <text x="944" y="360" fill="var(--muted, #949aa2)">nothing else</text>
  <text x="944" y="382" fill="var(--muted, #949aa2)">is dispatched</text>

  <text x="260" y="466" fill="var(--muted, #949aa2)">the script's effects have either not happened yet or have all happened</text>
</svg>
