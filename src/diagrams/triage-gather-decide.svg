<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #edeae3)"/>
    </marker>
    <marker id="mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted, #949aa2)"/>
    </marker>
  </defs>

  <!-- inquiry -->
  <rect x="20" y="130" width="140" height="100" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="90" y="168" fill="var(--ink, #edeae3)" text-anchor="middle">inquiry</text>
  <text x="90" y="192" fill="var(--muted, #949aa2)" text-anchor="middle">incident or</text>
  <text x="90" y="214" fill="var(--muted, #949aa2)" text-anchor="middle">support</text>
  <line x1="160" y1="180" x2="192" y2="180" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>

  <!-- agent -->
  <rect x="200" y="100" width="210" height="160" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="305" y="135" fill="var(--ink, #edeae3)" text-anchor="middle">agent</text>
  <text x="305" y="165" fill="var(--muted, #949aa2)" text-anchor="middle">reads, reasons,</text>
  <text x="305" y="189" fill="var(--muted, #949aa2)" text-anchor="middle">collects evidence</text>
  <text x="305" y="219" fill="var(--muted, #949aa2)" text-anchor="middle">returns findings,</text>
  <text x="305" y="243" fill="var(--muted, #949aa2)" text-anchor="middle">never a verdict</text>

  <!-- agent -> verdict -->
  <line x1="410" y1="180" x2="642" y2="180" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="526" y="168" fill="var(--muted, #949aa2)" text-anchor="middle">hypothesis + findings</text>
  <text x="526" y="202" fill="var(--muted, #949aa2)" text-anchor="middle">each cites an audit id</text>

  <!-- verdict function -->
  <rect x="650" y="100" width="200" height="160" rx="10" fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="1.5"/>
  <text x="750" y="135" fill="var(--ink, #edeae3)" text-anchor="middle">verdict()</text>
  <text x="750" y="165" fill="var(--muted, #949aa2)" text-anchor="middle">tested code</text>
  <text x="750" y="189" fill="var(--muted, #949aa2)" text-anchor="middle">rule per hypothesis</text>
  <text x="750" y="219" fill="var(--muted, #949aa2)" text-anchor="middle">no rule: fail</text>
  <text x="750" y="243" fill="var(--muted, #949aa2)" text-anchor="middle">no confidence input</text>

  <!-- outcomes -->
  <line x1="850" y1="150" x2="932" y2="150" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="940" y="155" fill="var(--ink, #edeae3)">pass</text>
  <text x="940" y="177" fill="var(--muted, #949aa2)">must be earned</text>
  <line x1="850" y1="220" x2="932" y2="220" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="940" y="225" fill="var(--ink, #edeae3)">fail</text>
  <text x="940" y="247" fill="var(--muted, #949aa2)">a human looks</text>

  <!-- MCP server under the agent -->
  <rect x="200" y="340" width="210" height="130" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="305" y="368" fill="var(--ink, #edeae3)" text-anchor="middle">MCP server</text>
  <text x="305" y="396" fill="var(--muted, #949aa2)" text-anchor="middle">read-only credential</text>
  <text x="305" y="420" fill="var(--muted, #949aa2)" text-anchor="middle">rollback wrapper</text>
  <text x="305" y="444" fill="var(--muted, #949aa2)" text-anchor="middle">audit log</text>

  <!-- agent <-> tools -->
  <line x1="305" y1="268" x2="305" y2="332" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-start="url(#ink)" marker-end="url(#ink)"/>
  <text x="317" y="304" fill="var(--muted, #949aa2)">tool calls</text>

  <!-- audit log -> verdict: the checks read tool results, not prose -->
  <path d="M410 444 H750 V268" fill="none" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="580" y="432" fill="var(--muted, #949aa2)" text-anchor="middle">tool results, read by audit id</text>

  <!-- any write: behind a gate only a human opens -->
  <path d="M305 470 V540 H638" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="470" y="528" fill="var(--muted, #949aa2)" text-anchor="middle">any write</text>
  <line x1="650" y1="515" x2="650" y2="565" stroke="var(--ink, #edeae3)" stroke-width="3" stroke-linecap="round"/>
  <text x="650" y="592" fill="var(--muted, #949aa2)" text-anchor="middle">human-only gate</text>
  <path d="M662 540 H742" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#mut)"/>
  <rect x="750" y="505" width="200" height="70" rx="10" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="850" y="545" fill="var(--muted, #949aa2)" text-anchor="middle">production write</text>
</svg>
