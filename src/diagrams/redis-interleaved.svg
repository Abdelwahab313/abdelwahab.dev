<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #edeae3)"/>
    </marker>
    <marker id="mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted, #949aa2)"/>
    </marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #57c7ba)"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <g stroke="var(--border, #262b33)" stroke-width="1.5">
    <line x1="180" y1="90" x2="180" y2="414"/>
    <line x1="480" y1="90" x2="480" y2="414"/>
    <line x1="780" y1="90" x2="780" y2="414"/>
  </g>

  <!-- heads -->
  <rect x="100" y="30" width="160" height="60" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="180" y="56" fill="var(--ink, #edeae3)" text-anchor="middle">server A</text>
  <text x="180" y="78" fill="var(--muted, #949aa2)" text-anchor="middle">client A's order</text>
  <rect x="400" y="30" width="160" height="60" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="480" y="56" fill="var(--ink, #edeae3)" text-anchor="middle">Redis</text>
  <text x="480" y="78" fill="var(--muted, #949aa2)" text-anchor="middle">one thread</text>
  <rect x="700" y="30" width="160" height="60" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="780" y="56" fill="var(--ink, #edeae3)" text-anchor="middle">server B</text>
  <text x="780" y="78" fill="var(--muted, #949aa2)" text-anchor="middle">client B's order</text>

  <!-- 1. A reads -->
  <line x1="180" y1="136" x2="472" y2="136" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="330" y="124" fill="var(--ink, #edeae3)" text-anchor="middle">GET sale:phone:stock</text>
  <line x1="480" y1="172" x2="188" y2="172" stroke="var(--muted, #949aa2)" stroke-width="1.5" marker-end="url(#mut)"/>
  <text x="330" y="160" fill="var(--muted, #949aa2)" text-anchor="middle">1</text>

  <!-- 2. B reads: both see 1 -->
  <line x1="780" y1="208" x2="488" y2="208" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="630" y="196" fill="var(--ink, #edeae3)" text-anchor="middle">GET sale:phone:stock</text>
  <line x1="480" y1="244" x2="772" y2="244" stroke="var(--muted, #949aa2)" stroke-width="1.5" marker-end="url(#mut)"/>
  <text x="630" y="232" fill="var(--muted, #949aa2)" text-anchor="middle">1</text>
  <text x="630" y="264" fill="var(--muted, #949aa2)" text-anchor="middle">both see 1</text>

  <!-- the checks happen in the app, in the gap -->
  <text x="168" y="214" fill="var(--muted, #949aa2)" text-anchor="end">1 &gt; 0: pass</text>
  <text x="792" y="310" fill="var(--muted, #949aa2)">1 &gt; 0: pass</text>

  <!-- 3. A decrements: A wins -->
  <line x1="180" y1="290" x2="472" y2="290" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="330" y="278" fill="var(--ink, #edeae3)" text-anchor="middle">DECR sale:phone:stock</text>
  <line x1="480" y1="326" x2="188" y2="326" stroke="var(--muted, #949aa2)" stroke-width="1.5" marker-end="url(#mut)"/>
  <text x="330" y="314" fill="var(--muted, #949aa2)" text-anchor="middle">0</text>
  <text x="330" y="346" fill="var(--muted, #949aa2)" text-anchor="middle">A wins</text>

  <!-- 4. B decrements a unit that is not there -->
  <line x1="780" y1="372" x2="488" y2="372" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="630" y="360" fill="var(--ink, #edeae3)" text-anchor="middle">DECR sale:phone:stock</text>
  <line x1="480" y1="408" x2="772" y2="408" stroke="var(--accent, #57c7ba)" stroke-width="1.5" marker-end="url(#acc)"/>
  <text x="630" y="396" fill="var(--accent, #57c7ba)" text-anchor="middle">-1</text>
  <text x="630" y="442" fill="var(--muted, #949aa2)" text-anchor="middle">B takes a unit that is not there</text>
</svg>
