<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #edeae3)"/>
    </marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #57c7ba)"/>
    </marker>
    <marker id="mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted, #949aa2)"/>
    </marker>
  </defs>

  <!-- request -->
  <rect x="20" y="120" width="110" height="50" rx="8" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="75" y="150" fill="var(--ink, #edeae3)" text-anchor="middle">request</text>
  <line x1="130" y1="145" x2="182" y2="145" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>

  <!-- 1. primary, rate limited -->
  <rect x="190" y="100" width="190" height="90" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="285" y="130" fill="var(--ink, #edeae3)" text-anchor="middle">Bedrock</text>
  <text x="285" y="154" fill="var(--muted, #949aa2)" text-anchor="middle">429, Retry-After</text>
  <text x="285" y="176" fill="var(--muted, #949aa2)" text-anchor="middle">breaker stays closed</text>

  <line x1="380" y1="145" x2="452" y2="145" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="416" y="135" fill="var(--muted, #949aa2)" text-anchor="middle">next</text>

  <!-- 2. breaker open, skipped -->
  <rect x="460" y="100" width="190" height="90" rx="10" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="555" y="130" fill="var(--muted, #949aa2)" text-anchor="middle">OpenAI</text>
  <text x="555" y="154" fill="var(--muted, #949aa2)" text-anchor="middle">breaker open</text>
  <text x="555" y="176" fill="var(--muted, #949aa2)" text-anchor="middle">skipped, no call</text>

  <line x1="650" y1="145" x2="722" y2="145" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="686" y="135" fill="var(--muted, #949aa2)" text-anchor="middle">next</text>

  <!-- 3. answers -->
  <rect x="730" y="100" width="190" height="90" rx="10" fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="1.5"/>
  <text x="825" y="130" fill="var(--ink, #edeae3)" text-anchor="middle">Gemini</text>
  <text x="825" y="154" fill="var(--accent, #57c7ba)" text-anchor="middle">answers</text>
  <text x="825" y="176" fill="var(--muted, #949aa2)" text-anchor="middle">breaker closed</text>

  <line x1="920" y1="145" x2="972" y2="145" stroke="var(--accent, #57c7ba)" stroke-width="1.5" marker-end="url(#acc)"/>
  <text x="980" y="150" fill="var(--ink, #edeae3)">response</text>

  <!-- if the last one refuses too -->
  <path d="M825 190 V242" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#mut)"/>
  <text x="840" y="222" fill="var(--muted, #949aa2)">if this one refuses too</text>
  <rect x="320" y="250" width="540" height="50" rx="10" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="590" y="281" fill="var(--muted, #949aa2)" text-anchor="middle">all refused: Reschedule with the smallest Retry-After</text>

  <text x="540" y="352" fill="var(--muted, #949aa2)" text-anchor="middle">a 429 moves the call on and leaves the breaker alone; a 503 or a timeout counts as a breaker failure</text>
</svg>
