<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <!-- consumer events, above the message bar -->
  <text x="120" y="130" fill="var(--ink, #edeae3)" text-anchor="start">receive</text>
  <line x1="120" y1="140" x2="120" y2="200" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>

  <text x="290" y="62" fill="var(--ink, #edeae3)" text-anchor="middle">INSERT event_id, UPDATE</text>
  <text x="290" y="82" fill="var(--ink, #edeae3)" text-anchor="middle">COMMIT</text>
  <line x1="290" y1="92" x2="290" y2="200" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>

  <text x="400" y="110" fill="var(--muted, #949aa2)" text-anchor="middle">crash before</text>
  <text x="400" y="130" fill="var(--muted, #949aa2)" text-anchor="middle">DeleteMessage</text>
  <line x1="400" y1="140" x2="400" y2="200" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="600" y="62" fill="var(--ink, #edeae3)" text-anchor="middle">receive again</text>
  <text x="600" y="82" fill="var(--muted, #949aa2)" text-anchor="middle">same event_id</text>
  <line x1="600" y1="92" x2="600" y2="200" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>

  <text x="760" y="110" fill="var(--accent, #57c7ba)" text-anchor="middle">INSERT hits the primary key</text>
  <text x="760" y="130" fill="var(--accent, #57c7ba)" text-anchor="middle">ER_DUP_ENTRY, rollback</text>
  <line x1="760" y1="140" x2="760" y2="200" stroke="var(--accent, #57c7ba)" stroke-width="1.5"/>

  <text x="940" y="62" fill="var(--ink, #edeae3)" text-anchor="middle">DeleteMessage</text>
  <line x1="940" y1="92" x2="940" y2="200" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>

  <!-- the message, as SQS sees it -->
  <rect x="120" y="200" width="380" height="28" rx="6" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <rect x="500" y="200" width="100" height="28" rx="6" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="600" y="200" width="340" height="28" rx="6" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>

  <text x="310" y="254" fill="var(--muted, #949aa2)" text-anchor="middle">hidden for the visibility timeout</text>
  <text x="550" y="254" fill="var(--muted, #949aa2)" text-anchor="middle">visible</text>
  <text x="770" y="254" fill="var(--muted, #949aa2)" text-anchor="middle">hidden again</text>
  <text x="950" y="254" fill="var(--muted, #949aa2)" text-anchor="start">gone</text>

  <text x="40" y="219" fill="var(--muted, #949aa2)" text-anchor="start">message</text>

  <text x="120" y="312" fill="var(--muted, #949aa2)">the change lands once, the message arrives twice; the key in the same transaction tells them apart</text>
</svg>
