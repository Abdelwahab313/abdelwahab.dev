<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <!-- time axis -->
  <g stroke="var(--border, #262b33)" stroke-width="1.5">
    <line x1="180" y1="372" x2="900" y2="372"/>
    <line x1="180" y1="366" x2="180" y2="378"/>
    <line x1="540" y1="366" x2="540" y2="378"/>
    <line x1="900" y1="366" x2="900" y2="378"/>
  </g>
  <g fill="var(--muted, #949aa2)" text-anchor="middle">
    <text x="180" y="400">0</text>
    <text x="540" y="400">1h</text>
    <text x="900" y="400">2h</text>
  </g>

  <!-- row 1: default scale-in -->
  <text x="24" y="92" fill="var(--ink, #edeae3)">default</text>
  <text x="24" y="112" fill="var(--muted, #949aa2)">scale-in</text>
  <rect x="180" y="80" width="252" height="28" rx="6" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <rect x="432" y="80" width="468" height="28" rx="6" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="666" y="99" fill="var(--muted, #949aa2)" text-anchor="middle">rest of the job, lost</text>

  <line x1="420" y1="40" x2="420" y2="80" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="420" y="32" fill="var(--ink, #edeae3)" text-anchor="middle">SIGTERM</text>
  <line x1="432" y1="122" x2="432" y2="146" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="432" y="162" fill="var(--ink, #edeae3)" text-anchor="middle">SIGKILL, 120 s later at most</text>

  <!-- row 2: with scale-in protection -->
  <text x="24" y="252" fill="var(--ink, #edeae3)">with task</text>
  <text x="24" y="272" fill="var(--muted, #949aa2)">protection</text>
  <rect x="180" y="240" width="720" height="28" rx="6" fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="1.5"/>
  <text x="540" y="259" fill="var(--ink, #edeae3)" text-anchor="middle">job runs to the end</text>

  <line x1="180" y1="200" x2="180" y2="240" stroke="var(--accent, #57c7ba)" stroke-width="1.5"/>
  <text x="180" y="192" fill="var(--accent, #57c7ba)" text-anchor="start">protect</text>

  <line x1="420" y1="200" x2="420" y2="240" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="420" y="192" fill="var(--muted, #949aa2)" text-anchor="middle">scale-in decided, task skipped</text>

  <line x1="900" y1="282" x2="900" y2="306" stroke="var(--accent, #57c7ba)" stroke-width="1.5"/>
  <text x="900" y="322" fill="var(--accent, #57c7ba)" text-anchor="end">unprotect, then stop</text>
</svg>
