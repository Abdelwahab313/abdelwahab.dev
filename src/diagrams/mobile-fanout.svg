<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 490" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" font-size="15">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #edeae3)"/>
    </marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #57c7ba)"/>
    </marker>
  </defs>

  <!-- queue in -->
  <rect x="30" y="190" width="200" height="80" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="130" y="222" fill="var(--ink, #edeae3)" text-anchor="middle">SQS FIFO</text>
  <text x="130" y="248" fill="var(--muted, #949aa2)" text-anchor="middle">state changes</text>

  <line x1="230" y1="230" x2="322" y2="230" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="276" y="219" fill="var(--muted, #949aa2)" text-anchor="middle">consume</text>

  <!-- the service -->
  <rect x="330" y="160" width="240" height="140" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="450" y="192" fill="var(--ink, #edeae3)" text-anchor="middle">real-time order service</text>
  <text x="450" y="216" fill="var(--muted, #949aa2)" text-anchor="middle">Node.js, Socket.IO</text>
  <rect x="350" y="240" width="200" height="40" rx="8" fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="1.5"/>
  <text x="450" y="265" fill="var(--ink, #edeae3)" text-anchor="middle">room order:42</text>

  <!-- clients -->
  <g fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5">
    <rect x="800" y="40" width="240" height="70" rx="10"/>
    <rect x="800" y="160" width="240" height="70" rx="10"/>
    <rect x="800" y="280" width="240" height="70" rx="10"/>
  </g>
  <text x="920" y="70" fill="var(--ink, #edeae3)" text-anchor="middle">kitchen app</text>
  <text x="920" y="94" fill="var(--muted, #949aa2)" text-anchor="middle">React Native</text>
  <text x="920" y="190" fill="var(--ink, #edeae3)" text-anchor="middle">driver app</text>
  <text x="920" y="214" fill="var(--muted, #949aa2)" text-anchor="middle">React Native</text>
  <text x="920" y="310" fill="var(--ink, #edeae3)" text-anchor="middle">customer web</text>
  <text x="920" y="334" fill="var(--muted, #949aa2)" text-anchor="middle">Next.js</text>

  <!-- one emit, every socket in the room -->
  <g fill="none" stroke="var(--accent, #57c7ba)" stroke-width="1.5" marker-end="url(#acc)">
    <path d="M550 260 H680 V75 H792"/>
    <path d="M550 260 H680 V195 H792"/>
    <path d="M550 260 H680 V315 H792"/>
  </g>
  <text x="640" y="28" fill="var(--accent, #57c7ba)" text-anchor="middle">one emit, every socket in the room</text>

  <!-- redis, read source -->
  <rect x="330" y="390" width="240" height="70" rx="10" fill="var(--surface, #161a20)" stroke="var(--ink, #edeae3)" stroke-width="1.5"/>
  <text x="450" y="420" fill="var(--ink, #edeae3)" text-anchor="middle">Redis</text>
  <text x="450" y="444" fill="var(--muted, #949aa2)" text-anchor="middle">read source</text>

  <line x1="410" y1="300" x2="410" y2="382" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="398" y="346" fill="var(--muted, #949aa2)" text-anchor="end">write state</text>
  <line x1="490" y1="382" x2="490" y2="308" stroke="var(--ink, #edeae3)" stroke-width="1.5" marker-end="url(#ink)"/>
  <text x="502" y="346" fill="var(--muted, #949aa2)" text-anchor="start">snapshot on watch</text>

  <!-- mysql, behind -->
  <rect x="800" y="390" width="240" height="70" rx="10" fill="none" stroke="var(--muted, #949aa2)" stroke-width="1.5"/>
  <text x="920" y="420" fill="var(--muted, #949aa2)" text-anchor="middle">MySQL</text>
  <text x="920" y="444" fill="var(--muted, #949aa2)" text-anchor="middle">behind the cache</text>

  <line x1="570" y1="425" x2="792" y2="425" stroke="var(--muted, #949aa2)" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#ink)"/>
  <text x="681" y="414" fill="var(--muted, #949aa2)" text-anchor="middle">write-behind, async</text>
</svg>
