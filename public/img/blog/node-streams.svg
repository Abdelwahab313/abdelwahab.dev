<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #edeae3)"/>
    </marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #57c7ba)"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="var(--surface, #161a20)"/>

  <!-- producer -->
  <rect x="90" y="250" width="170" height="110" rx="18" fill="none" stroke="var(--ink, #edeae3)" stroke-width="3"/>
  <line x1="260" y1="305" x2="394" y2="305" stroke="var(--ink, #edeae3)" stroke-width="3" marker-end="url(#ink)"/>
  <text x="327" y="285" font-size="28" fill="var(--ink, #edeae3)" text-anchor="middle">write</text>

  <!-- buffer filling toward the mark -->
  <rect x="410" y="250" width="380" height="110" rx="18" fill="none" stroke="var(--ink, #edeae3)" stroke-width="3"/>
  <rect x="434" y="274" width="76" height="62" rx="10" fill="var(--muted, #949aa2)" opacity="0.45"/>
  <rect x="522" y="274" width="76" height="62" rx="10" fill="var(--muted, #949aa2)" opacity="0.45"/>
  <rect x="610" y="274" width="76" height="62" rx="10" fill="var(--muted, #949aa2)" opacity="0.45"/>
  <line x1="660" y1="230" x2="660" y2="380" stroke="var(--ink, #edeae3)" stroke-width="3" stroke-dasharray="10 10"/>

  <!-- slow sink -->
  <line x1="790" y1="305" x2="924" y2="305" stroke="var(--muted, #949aa2)" stroke-width="3"/>
  <rect x="940" y="250" width="170" height="110" rx="18" fill="none" stroke="var(--ink, #edeae3)" stroke-width="3"/>

  <!-- the signal back -->
  <path d="M600 250 C600 110 175 110 175 238" fill="none" stroke="var(--accent, #57c7ba)" stroke-width="4" marker-end="url(#acc)"/>
  <text x="388" y="120" font-size="30" fill="var(--accent, #57c7ba)" text-anchor="middle">false</text>

  <path d="M600 360 C600 490 175 490 175 372" fill="none" stroke="var(--ink, #edeae3)" stroke-width="3" marker-end="url(#ink)"/>
  <text x="388" y="510" font-size="28" fill="var(--ink, #edeae3)" text-anchor="middle">drain</text>
</svg>
