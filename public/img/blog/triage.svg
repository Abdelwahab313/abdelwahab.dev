<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #edeae3)"/>
    </marker>
    <marker id="mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted, #949aa2)"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="var(--surface, #161a20)"/>

  <!-- the agent: gathers, never decides -->
  <rect x="90" y="110" width="360" height="200" rx="18" fill="none" stroke="var(--ink, #edeae3)" stroke-width="3"/>
  <text x="270" y="222" font-size="30" fill="var(--ink, #edeae3)" text-anchor="middle">agent</text>

  <!-- evidence handed to the verdict -->
  <line x1="450" y1="210" x2="766" y2="210" stroke="var(--ink, #edeae3)" stroke-width="3" marker-end="url(#ink)"/>
  <text x="610" y="192" font-size="26" fill="var(--muted, #949aa2)" text-anchor="middle">evidence</text>

  <!-- the verdict: small, solid, in code -->
  <rect x="780" y="150" width="330" height="120" rx="18" fill="var(--accent-soft, rgba(87,199,186,0.12))" stroke="var(--accent, #57c7ba)" stroke-width="4"/>
  <text x="945" y="221" font-size="30" fill="var(--ink, #edeae3)" text-anchor="middle">verdict</text>

  <!-- the write path, blocked by a human gate -->
  <path d="M270 310 V430 H630" fill="none" stroke="var(--muted, #949aa2)" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="645" y1="398" x2="645" y2="462" stroke="var(--ink, #edeae3)" stroke-width="5" stroke-linecap="round"/>
  <path d="M660 430 H766" fill="none" stroke="var(--muted, #949aa2)" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#mut)"/>
  <text x="645" y="506" font-size="26" fill="var(--muted, #949aa2)" text-anchor="middle">human gate</text>
  <rect x="780" y="380" width="330" height="100" rx="18" fill="none" stroke="var(--muted, #949aa2)" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="945" y="440" font-size="26" fill="var(--muted, #949aa2)" text-anchor="middle">write</text>
</svg>
